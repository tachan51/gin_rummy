<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ジンラミー vs 最強AI</title>
<meta name="description" content="ブラウザで遊べるジンラミー。カードを数え、相手の手を読む強いAIと対戦できます。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect x='10' y='4' width='44' height='56' rx='6' fill='%23fff' stroke='%23333' stroke-width='3'/><text x='32' y='44' font-size='30' text-anchor='middle' fill='%23c0392b'>♥</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <h1>ジンラミー <span class="vs">vs AI</span></h1>
  <div class="score" id="score" aria-live="polite"></div>
  <div class="top-actions">
    <button id="btnRules" class="ghost">ルール</button>
    <button id="btnSettings" class="ghost">設定</button>
    <button id="btnNew" class="ghost">新しいゲーム</button>
  </div>
</header>

<main class="table">
  <section class="player-area opp">
    <div class="label"><span id="oppName">AI</span> <span class="sub" id="oppInfo"></span></div>
    <div class="hand" id="oppHand"></div>
  </section>

  <section class="center">
    <div class="pile-wrap">
      <button class="pile" id="stock" aria-label="山札"><div class="card back"></div><span class="count" id="stockCount"></span></button>
      <div class="pile-label">山札</div>
    </div>
    <div class="pile-wrap">
      <button class="pile" id="discard" aria-label="捨て札"></button>
      <div class="pile-label">捨て札</div>
    </div>
    <div class="message" id="message" aria-live="polite"></div>
  </section>

  <section class="player-area me">
    <div class="actions" id="actions"></div>
    <div class="hand mine" id="myHand"></div>
    <div class="label"><span>あなた</span> <span class="sub" id="myInfo"></span>
      <span class="sort">並び:
        <button data-sort="meld" class="chip">役</button><button data-sort="suit" class="chip">スート</button><button data-sort="rank" class="chip">数字</button>
      </span>
    </div>
  </section>

  <details class="log">
    <summary>ログ</summary>
    <ol id="log"></ol>
  </details>
</main>

<div class="modal" id="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true">
    <div id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<template id="rulesTpl">
  <h2>ジンラミーのルール</h2>
  <ul class="rules">
    <li>2人用。各自10枚配られ、残りは山札、1枚を表にして捨て札にします。</li>
    <li>手番では <b>山札</b> か <b>捨て札の一番上</b> から1枚引き、1枚捨てます（捨て札から取ったカードはそのターンに捨てられません）。</li>
    <li><b>メルド（役）</b>：同じ数字3〜4枚（セット）か、同じスートの連続3枚以上（ラン）。Aは1としてのみ使い、K-A-2 はつながりません。</li>
    <li>メルドに入らないカードが <b>デッドウッド</b>。点数は A=1、2〜10=数字、J/Q/K=10。</li>
    <li>捨てた後のデッドウッドが <b>10点以下</b> なら <b>ノック</b> して手を公開できます。相手は自分のメルドを作り、ノックした側のメルドに <b>付け札</b> できます。</li>
    <li>ノック側の得点＝相手のデッドウッド − 自分のデッドウッド。相手のデッドウッドが同じか少なければ <b>アンダーカット</b>：相手が 差＋25点。</li>
    <li>デッドウッド0でノックすると <b>ジン</b>：25点＋相手のデッドウッド（付け札なし）。引いた11枚全部がメルドなら <b>ビッグジン</b>：31点＋相手のデッドウッド。</li>
    <li>最初の表札は、非ディーラー→ディーラーの順で取るかパスを選べます。両者パスなら非ディーラーが山札から引いて開始。</li>
    <li>山札が残り2枚になって誰もノックしなければ、そのハンドは流れます（無得点）。</li>
    <li>先に目標点（既定100点）に達した方の勝ち。勝者に +100、各自勝ったハンド数 ×25 のボーナス。相手が1ハンドも取れなければ（シャットアウト）勝者の合計は2倍。</li>
  </ul>
  <h3>操作</h3>
  <ul class="rules">
    <li>山札・捨て札をタップして引きます。</li>
    <li>カードをタップで選択、もう一度タップ（または「捨てる」）で捨てます。「ノック」はデッドウッドが10以下になるカードを選んだときに押せます。</li>
    <li>手札の色付きの下線はメルドです。「ヒント」で最強AIのおすすめを見られます。</li>
  </ul>
</template>

<script type="module" src="js/ui.js"></script>
</body>
</html>
